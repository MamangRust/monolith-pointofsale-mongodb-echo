syntax = "proto3";

package pb.user;

import "common/api.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/MamangRust/monolith-point-of-sale-pb/users;users";

message FindAllUserRequest {
    int32 page = 1;
    int32 page_size = 2;
    string search = 3;
}

message FindByIdUserRequest {
    int32 id = 1;
}

message CreateUserRequest {
    string firstname = 1;
    string lastname = 2;
    string email = 3;
    string password = 4;
    string confirm_password = 5;
}

message FindByEmailUserRequest {
    string email = 1;
}

message FindByVerificationCodeUserRequest {
    string verification_code = 1;
}

// CreateUserRecordRequest registers a user with auth-managed fields (password
// hash, verification code, verification flag). Suffix "Record" is required
// because CreateUserRequest already exists in this proto package.
message CreateUserRecordRequest {
    string firstname = 1;
    string lastname = 2;
    string email = 3;
    string password = 4;
    string verification_code = 5;
    bool is_verified = 6;
}

message UpdateUserIsVerifiedUserRequest {
    int32 id = 1;
    bool is_verified = 2;
}

message UpdateUserPasswordUserRequest {
    int32 id = 1;
    string password = 2;
}

message UpdateUserRequest {
    int32 id = 1;
    string firstname = 2;
    string lastname = 3;
    string email = 4;
    string password = 5;
    string confirm_password = 6;
}

message UserResponse {
    int32 id = 1;
    string firstname = 2;
    string lastname = 3;
    string email = 4;
    string created_at = 5;
    string updated_at = 6;
}

// UserResponseWithPassword carries the password hash. It exists solely for
// the auth service's login/verify flows and must never be exposed through the
// apigateway.
message UserResponseWithPassword {
    int32 id = 1;
    string firstname = 2;
    string lastname = 3;
    string email = 4;
    string password = 5;
    string created_at = 6;
    string updated_at = 7;
}

message UserResponseDeleteAt{
    int32 id = 1;
    string firstname = 2;
    string lastname = 3;
    string email = 4;
    string created_at = 5;
    string updated_at = 6;
    google.protobuf.StringValue deleted_at = 7;
}

message ApiResponseUser {
    string status = 1;
    string message = 2;
    UserResponse data = 3;
}

message ApiResponseUserWithPassword {
    string status = 1;
    string message = 2;
    UserResponseWithPassword data = 3;
}

message ApiResponseUserDeleteAt{
    string status = 1;
    string message = 2;
    UserResponseDeleteAt data = 3;
}

message ApiResponsesUser {
    string status = 1;
    string message = 2;
    repeated UserResponse data = 3;
}

message ApiResponseUserDelete {
    string status = 1;
    string message = 2;
}

message ApiResponseUserAll {
    string status = 1;
    string message = 2;
}

message ApiResponsePaginationUserDeleteAt{
    string status = 1;
    string message = 2;
    repeated UserResponseDeleteAt data = 3;
    pb.common.PaginationMeta pagination = 4;
}

message ApiResponsePaginationUser {
    string status = 1;
    string message = 2;
    repeated UserResponse data = 3;
    pb.common.PaginationMeta pagination = 4;
}
